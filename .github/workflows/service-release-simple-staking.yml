name: simple-staking-publish

on:
  push:
    branches:
      - "main"
      - "release/v1.x"
    tags:
      - "simple-staking/*"
  workflow_dispatch:

# For github OIDC authentication to AWS
permissions:
  id-token: write
  contents: read

jobs:
  lint_test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Corepack
        run: npm install -g corepack && corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

  s3_publish:
    needs: [lint_test]
    permissions:
      id-token: write # OIDC assume-role for AWS
      contents: write # publish checksum manifest as a release asset (#253)
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - environment: vault-devnet
            aws_account: 537927626649
          - environment: canon-devnet
            aws_account: 537927626649
          - environment: btc-mainnet-devnet
            aws_account: 537927626649
          - environment: edge-devnet
            aws_account: 537927626649
          - environment: testnet
            aws_account: 615368094160
          - environment: mainnet
            aws_account: 490721144737

    concurrency:
      group: ${{ github.workflow }}-${{ matrix.environment }}-${{ github.sha }}
      cancel-in-progress: false
    environment: ${{ matrix.environment }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Configure AWS credentials (assume per-account role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ matrix.aws_account }}:role/gha-deployment
          role-session-name: gh-terragrunt-plan
          aws-region: ap-east-1

      - name: Install Corepack
        run: npm install -g corepack && corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project
        run: pnpm run build
        env:
          NODE_OPTIONS: "--max-old-space-size=8192" # 8GB node memory limit
          NEXT_PUBLIC_MEMPOOL_API: ${{ vars.NEXT_PUBLIC_MEMPOOL_API }}
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_NETWORK: ${{ vars.NEXT_PUBLIC_NETWORK }}
          NEXT_PUBLIC_DISPLAY_TESTING_MESSAGES: ${{ vars.NEXT_PUBLIC_DISPLAY_TESTING_MESSAGES }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
          NEXT_PUBLIC_FIXED_STAKING_TERM: ${{ vars.NEXT_PUBLIC_FIXED_STAKING_TERM }}
          NEXT_PUBLIC_COMMIT_HASH: ${{ github.sha }}
          NEXT_PUBLIC_CANONICAL: ${{ vars.NEXT_PUBLIC_CANONICAL }}
          NEXT_PUBLIC_BBN_GAS_PRICE: ${{ vars.NEXT_PUBLIC_BBN_GAS_PRICE }}
          NEXT_PUBLIC_SIDECAR_API_URL: ${{ vars.NEXT_PUBLIC_SIDECAR_API_URL }}
          NEXT_PUBLIC_BABYLON_EXPLORER: ${{ vars.NEXT_PUBLIC_BABYLON_EXPLORER }}
          NEXT_PUBLIC_REPLAYS_RATE: ${{ vars.NEXT_PUBLIC_REPLAYS_RATE }}
          NEXT_PUBLIC_STAKING_DISABLED: ${{ vars.NEXT_PUBLIC_STAKING_DISABLED }}
          NEXT_PUBLIC_DISABLED_WALLETS: ${{ vars.NEXT_PUBLIC_DISABLED_WALLETS }}
          NEXT_PUBLIC_REDACT_TELEMETRY: ${{ vars.NEXT_PUBLIC_REDACT_TELEMETRY }}
          NEXT_PUBLIC_REOWN_PROJECT_ID: ${{ vars.NEXT_PUBLIC_REOWN_PROJECT_ID }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          GA4_MEASUREMENT_ID: ${{ vars.GA4_MEASUREMENT_ID }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_URL: ${{ vars.SENTRY_URL }}
          SENTRY_RELEASE: ${{ github.sha }}
          SENTRY_DIST: ${{ github.run_id }}
          SENTRY_ENVIRONMENT: ${{ matrix.environment }}
          NEXT_PUBLIC_RELEASE_ID: ${{ github.sha }}
          NEXT_PUBLIC_DIST_ID: ${{ github.run_id }}
          NEXT_PUBLIC_SENTRY_ENVIRONMENT: ${{ matrix.environment }}
          # Feature Flags
          NEXT_PUBLIC_FF_ENABLE_LEDGER: ${{ vars.NEXT_PUBLIC_FF_ENABLE_LEDGER }}

      - name: Copy all index.html to fix path for btc, baby, rewards
        run: |
          cd services/simple-staking/dist
          cp index.html btc
          cp index.html baby
          cp index.html rewards

      - name: Generate sha256sum checksum
        run: |
          cd services/simple-staking/dist
          FILES_CHECKSUM_PATH="/tmp/simple-staking-${{ matrix.environment }}-${{ github.sha }}-files-checksum.txt"
          GLOBAL_CHECKSUM_PATH="/tmp/simple-staking-${{ matrix.environment }}-${{ github.sha }}-global-checksum.txt"
          find . -type f -exec sha256sum {} \; | sort > $FILES_CHECKSUM_PATH # sort is for make sure the order on different OS is the same
          sha256sum $FILES_CHECKSUM_PATH | cut -d' ' -f1 > $GLOBAL_CHECKSUM_PATH # cut is for remove the filename from the output

      - name: Archive output
        run: tar -czvf /tmp/simple-staking-${{ matrix.environment }}-${{ github.sha }}.tar.gz -C services/simple-staking/dist .

      - name: Upload to S3 with commit sha
        run: |
          aws s3 cp /tmp/simple-staking-${{ matrix.environment }}-${{ github.sha }}.tar.gz s3://${{ vars.S3_PUBLIC_BUCKET_NEW }}/simple-staking/${{ matrix.environment }}/${{ github.sha }}.tar.gz
          aws s3 cp /tmp/simple-staking-${{ matrix.environment }}-${{ github.sha }}-files-checksum.txt s3://${{ vars.S3_CHECKSUM_BUCKET_NEW }}/simple-staking/${{ matrix.environment }}/${{ github.sha }}-files-checksum.txt
          aws s3 cp /tmp/simple-staking-${{ matrix.environment }}-${{ github.sha }}-global-checksum.txt s3://${{ vars.S3_CHECKSUM_BUCKET_NEW }}/simple-staking/${{ matrix.environment }}/${{ github.sha }}-global-checksum.txt

      - name: Upload to S3 with Git Tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          # Bound via env, not interpolated into run: — git refnames accept
          # shell metacharacters and this job holds AWS OIDC + contents:write.
          GIT_TAG: ${{ github.ref_name }}
        run: |
          aws s3 cp /tmp/simple-staking-${{ matrix.environment }}-${{ github.sha }}.tar.gz "s3://${{ vars.S3_PUBLIC_BUCKET_NEW }}/simple-staking/${{ matrix.environment }}/${GIT_TAG}.tar.gz"
          aws s3 cp /tmp/simple-staking-${{ matrix.environment }}-${{ github.sha }}-files-checksum.txt "s3://${{ vars.S3_CHECKSUM_BUCKET_NEW }}/simple-staking/${{ matrix.environment }}/${GIT_TAG}-files-checksum.txt"
          aws s3 cp /tmp/simple-staking-${{ matrix.environment }}-${{ github.sha }}-global-checksum.txt "s3://${{ vars.S3_CHECKSUM_BUCKET_NEW }}/simple-staking/${{ matrix.environment }}/${GIT_TAG}-global-checksum.txt"

      # Last step: publishing the manifest must not block the S3 uploads above.
      - name: Publish checksum manifest as an immutable per-sha release
        # Only real deploy refs (a dispatch from an arbitrary branch must not
        # notarize builds), and only envs the integrity checker monitors — the
        # other envs would mint releases+tags nobody ever reads (~7/push
        # otherwise). Extend the env list together with the checker's
        # targets.json.
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release/v1.x' || startsWith(github.ref, 'refs/tags/')) && contains(fromJSON('["mainnet","testnet"]'), matrix.environment)
        uses: ./.github/actions/publish-integrity-manifest
        with:
          service: simple-staking
          environment: ${{ matrix.environment }}
