name: Build and Release in Mono Repo

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to release RC for'
        required: true
        type: choice
        options:
          - '@babylonlabs-io/ts-sdk'
          - '@babylonlabs-io/babylon-tbv-rust-wasm'
      preid:
        description: 'Pre-release identifier (rc, alpha, beta)'
        required: true
        default: 'rc'
        type: string

concurrency:
  group: package-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build_and_release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write # needed for provenance data generation
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2 https://github.com/actions/checkout/releases/tag/v6.0.2
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0 https://github.com/actions/setup-node/releases/tag/v4.4.0
        with:
          node-version: '24.10.0'

      - name: Install Corepack
        run: npm install -g corepack && corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Single Version Policy
        if: github.event_name == 'push'
        run: |-
          # Exit immediately if any command in the script fails
          set -e

          if pnpm exec syncpack list-mismatches; then
            echo "✅ Dependency versions are aligned"
          else
            # Add an annotation to the Checks tab with a helpful hint
            echo "::error title=Dependency mismatch::Run 'pnpm exec syncpack list-mismatches' locally (and 'pnpm exec syncpack fix-mismatches' to auto-fix)." >&2
            exit 1
          fi

      - name: Build all
        run: pnpm exec nx run-many --target=build --all

      - name: Lint all
        run: pnpm exec nx run-many --target=lint --all

      - name: Test all
        run: pnpm exec nx run-many --target=test --all

      # Must stay last for its event: the release resolves `workspace:*` deps to
      # concrete versions on disk, which makes the specifiers recorded in
      # pnpm-lock.yaml stale. Any `pnpm install` after this step would fail.
      - name: Release changed packages
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          pnpm run ci:release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      # Uses the same driver as the stable path so release candidates get the
      # same dependency-pinning and pre-publish checks. The previous `npm
      # publish` could not resolve the `workspace:` protocol at all, so every
      # RC shipped a literal `workspace:*` to consumers.
      - name: Release RC to npm
        if: github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
          RELEASE_PROJECTS: ${{ inputs.package }}
          RELEASE_SPECIFIER: prerelease
          RELEASE_PREID: ${{ inputs.preid }}
          RELEASE_DIST_TAG: next
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          pnpm run ci:release
